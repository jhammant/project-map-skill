name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - name: Installer syntax
        run: bash -n install.sh
      - name: Installer into a scratch home
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh
          test -L "$HOME/.claude/skills/map"
          grep -q '^name: project-map' "$HOME/.claude/agents/project-map.md"
          ! grep -q '{{SKILLS}}' "$HOME/.claude/agents/project-map.md"
          test -f "$HOME/.config/project-map/config.json"
